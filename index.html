function switchTab(i){if(modal)return;active=i;selected=remaining()===0?lastIndex():-1;count=remaining();tabStyle();render(false);$('tabs').querySelectorAll('button')[i].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}
function lastIndex(){const b=ballot();return Number(state.days[day]?.['_last_'+current().id]??Object.keys(b).at(-1)??-1)}
function render(keep=true){const c=$('content'),top=keep?c.scrollTop:0,g=current();$('heading').textContent=g.name;$('desc').textContent=g.desc;c.replaceChildren();if(g.id==='visual'){c.append(node('div','notice','투표가 사전에 완료된 부문입니다.'))}else{const list=node('div','list'+(g.images?' coverlist':''));const votes=totals(g.id),total=sum(votes);g.songs.forEach((s,i)=>{let b=node('button','candidate'+(selected===i?' selected':''));b.type='button';b.dataset.index=i;b.setAttribute('aria-pressed',selected===i);b.setAttribute('aria-label',`${i+1}. ${s}, ${fmt(votes[i]||0)}표`);b.disabled=remaining()===0||!openNow();let num=node('span','number',i+1),info=node('div','info'),clip=node('div','titleclip'),song=node('span','song',s);clip.append(song);let v=votes[i]||0,stats=node('div','stats',(total?(v/total*100).toFixed(1):'00')+'% / '+fmt(v)+'표');if(g.images){let img=node('img','coverart');img.src=g.images[i];img.alt=s+' 앨범커버';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{img.alt='이미지를 불러오지 못했습니다'};let line=node('div','coverline');line.append(num,clip);info.append(line,stats);b.append(img,info)}else{info.append(clip,stats);b.append(num,info)}b.onclick=()=>{if(modal||!remaining()||!openNow())return;selected=selected===i?-1:i;count=remaining();render(true)};list.append(b)});c.append(list)}c.scrollTop=top;footer();refreshHeader();requestAnimationFrame(marquee)}
function marquee(){document.querySelectorAll('.candidate').forEach(b=>{b.classList.remove('moving');if(Number(b.dataset.index)!==selected||!remaining()||modal)return;let clip=b.querySelector('.titleclip'),song=b.querySelector('.song');let dist=song.scrollWidth-clip.clientWidth;if(dist>2){b.style.setProperty('--travel',-dist+'px');b.style.setProperty('--duration',Math.max(4,dist/28+2)+'s');b.classList.add('moving')}})}
function footer(){let f=$('footer');f.replaceChildren();let left=node('div','footleft'),right=node('button','footright','투표하기');right.type='button';let g=current(),r=remaining();if(g.id==='visual'){left.textContent='이미 투표가 완료되었어요!';right.disabled=true}else if(!openNow()){left.textContent='투표 기간이 아닙니다';right.disabled=true}else if(!r){left.textContent='투표를 완료했습니다';right.textContent='투표 공유하기';right.onclick=share}else if(selected<0){left.textContent='후보를 누른 후 투표하세요';right.disabled=true}else{let label=node('span','countlabel','투표 수'),adj=node('div','adjust'),minus=node('button','','−'),plus=node('button','','+');minus.setAttribute('aria-label','투표 수 감소');plus.setAttribute('aria-label','투표 수 증가');minus.disabled=count<=1;plus.disabled=count>=r;minus.onclick=()=>{count--;footer()};plus.onclick=()=>{count++;footer()};adj.append(minus,node('strong','',count),plus);left.append(label,adj);right.onclick=submit}f.append(left,right)}
function checkDay(){let d=dayKey();if(d!==day){day=d;selected=-1;count=remaining();closeModal();render(true);return true}return false}
function submit(){if(modal||checkDay()||!openNow()||selected<0)return;load();let r=remaining();if(count<1||count>r){render(true);return}let g=current();let old=JSON.stringify(state);let b=(state.days[day]??={});let v=(b[g.id]??={});v[selected]=(v[selected]||0)+count;b['_last_'+g.id]=selected;if(!save()){state=JSON.parse(old);alert('브라우저 저장에 실패했습니다.');return}last={name:g.songs[selected],count,group:g.name};modal=true;render(true);$('modalTitle').textContent=g.name+' 투표 완료!';$('modalRemaining').textContent=`소진할 수 있는 투표권이 ${remaining()}장 남았어요.`;$('modalVote').textContent=`${last.name}에 ${last.count}표 투표했습니다.`;$('overlay').classList.remove('hidden');$('continue').focus();$('live').textContent='투표가 저장되었습니다. (테스트)'}
function closeModal(){if(!modal)return;modal=false;$('overlay').classList.add('hidden');if(remaining()>0)selected=-1;count=remaining();render(true)}
function share(){let g=current();let lines=Object.entries(ballot()).filter(([i,v])=>v>0).map(([i,v])=>`${g.songs[i]} : ${v}표`);let text=['💎 2026 SCA 세븐틴-캐럿 자체 연말 시상식',g.name,'',...lines,'','투표 참여하기',location.protocol.startsWith('http')?location.href.split('#')[0]:''].filter(Boolean).join('\n');window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text),'_blank','noopener,noreferrer')}
// Convert a conventional desktop mouse wheel into horizontal tab scrolling only over the tab strip.
$('tabs').addEventListener('wheel',e=>{
 if(modal||e.ctrlKey||e.metaKey||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
 const nav=$('tabs');if(nav.scrollWidth<=nav.clientWidth)return;
 if(Math.abs(e.deltaX)>=Math.abs(e.deltaY))return;
 const scale=e.deltaMode===1?16:e.deltaMode===2?nav.clientWidth:1;
 nav.scrollLeft+=e.deltaY*scale;e.preventDefault();
},{passive:false});
$('continue').onclick=closeModal;$('modalShare').onclick=share;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});window.addEventListener('resize',marquee);window.addEventListener('storage',e=>{if(e.key===KEY){load();if(!modal){if(!remaining())selected=lastIndex();count=Math.min(count,remaining());render(true)}}});window.addEventListener('focus',()=>{checkDay();refreshHeader()});if(document.fonts)document.fonts.ready.then(marquee);tabs();if(!remaining())selected=lastIndex();render(false);setInterval(()=>{checkDay();refreshHeader()},1000);
</script></body></html>
